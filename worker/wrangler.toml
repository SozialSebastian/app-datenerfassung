name = "mosaik-sync"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# jede Minute prüfen, ob eine Erinnerung fällig ist
[triggers]
crons = ["* * * * *"]

# Notion-Seite „Rezepte“ (nur die Kennung, der Schlüssel liegt als Secret NOTION_TOKEN)
[vars]
NOTION_RECIPES = "28e9d856995e800f93dbc9933a5abece"

[[d1_databases]]
binding = "DB"
database_name = "mosaik"
database_id = "__D1_ID__" # wird beim Veröffentlichen automatisch eingesetzt
