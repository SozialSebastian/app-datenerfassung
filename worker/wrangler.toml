name = "mosaik-sync"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# jede Minute prüfen, ob eine Erinnerung fällig ist
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "mosaik"
database_id = "__D1_ID__" # wird beim Veröffentlichen automatisch eingesetzt
